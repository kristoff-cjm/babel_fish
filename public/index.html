<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Babel Fish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 mb-0">Babel Fish</h1>
            <div class="d-flex justify-content-between align-items-center">
                <button id="refreshBtn" class="btn btn-outline-secondary d-inline-flex gap-1 me-2" onclick="refreshMessages()">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
                
                <select id="languageSelect" class="form-select" aria-label="Select Language" onchange="switchLanguage()">
                    <option value="en" selected>English</option>
                    <option value="es">Español</option>
                </select>
            </div>
        </div>

        <div id="messageContainer" class="border rounded p-3 bg-white mb-3" style="height: 400px; overflow-y: auto;">
            <!-- Messages will appear here -->
        </div>

        <textarea id="messageInput" class="form-control mb-2" rows="2" placeholder="Type a message or use the mic...">
        </textarea>
        <div class="d-flex justify-content-end">
            <button id="recordBtn" class="btn btn-danger mx-2" onclick="record()">
                🎤 Record
            </button>
            <button id="sendBtn" class="btn btn-success" onclick="submitText()">
                Send
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="client.js"></script>
</body>

</html>
